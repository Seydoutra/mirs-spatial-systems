<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#02030d" />
    <meta name="description" content="Espace d’administration MIRS Spatial Systems." />
    <base id="site-base" href="../" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      (() => {
        const parts = location.pathname.split('/').filter(Boolean);
        const basePath = location.hostname.endsWith('.github.io') && parts[0] ? `/${parts[0]}/` : '/';
        document.getElementById('site-base').href = basePath;
        try { document.documentElement.dataset.theme = localStorage.getItem('mirs-future-theme') || 'dark'; } catch { document.documentElement.dataset.theme = 'dark'; }
      })();
    </script>
    <title>MIRS — Administration</title>
    <link rel="stylesheet" href="mirs-future.css?v=nova-1" />
    <link rel="stylesheet" href="mirs-nova.css?v=nova-1" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="mirs-future.js?v=nova-1"></script>
  </body>
</html>
