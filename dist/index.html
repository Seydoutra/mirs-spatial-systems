<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#02030d" />
    <meta name="description" content="MIRS Spatial Systems — solutions intégrées en informatique, imprimerie, formation, création d’agence et maintenance en Guinée. Représentant exclusif d’AMADEUS." />
    <base id="site-base" href="/" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;700&display=swap" rel="stylesheet" />
    <script>
      (() => {
        const parts = location.pathname.split('/').filter(Boolean);
        const basePath = location.hostname.endsWith('.github.io') && parts[0] ? `/${parts[0]}/` : '/';
        document.getElementById('site-base').href = basePath;
        const restoredRoute = new URLSearchParams(location.search).get('route');
        if (restoredRoute && basePath !== '/') history.replaceState(null, '', `${basePath.slice(0, -1)}${restoredRoute}`);
        try { document.documentElement.dataset.theme = localStorage.getItem('mirs-future-theme') || 'dark'; } catch { document.documentElement.dataset.theme = 'dark'; }
      })();
    </script>
    <title>MIRS — Spatial Systems</title>
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"MIRS SARL","alternateName":"Maintenance Informatique, Réseaux & Systèmes","foundingDate":"2006","url":"https://mirsgn.com","address":{"@type":"PostalAddress","addressLocality":"Conakry","addressCountry":"GN"},"subOrganization":[{"@type":"Organization","name":"MIRS Informatique"},{"@type":"Organization","name":"MIRS Imprimerie"}]}</script>
    <link rel="stylesheet" href="mirs-nova.css?v=nova-3" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="mirs-future.js?v=nova-3"></script>
  </body>
</html>
