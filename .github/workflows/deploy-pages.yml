name: Deploy MIRS to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - id: pages
        uses: actions/configure-pages@v5
      - name: Reconstruct on-demand films
        run: |
          mkdir -p dist/assets/video
          cat dist/assets/video-chunks/technology-flow-* > dist/assets/video/technology-flow.mp4
          cat dist/assets/video-chunks/imprimerie-presentation-* > dist/assets/video/imprimerie-presentation.mp4
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
